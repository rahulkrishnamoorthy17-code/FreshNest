<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Master Background Shield Gradient -->
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e9291"/>
      <stop offset="45%" stop-color="#0a7473"/>
      <stop offset="100%" stop-color="#04383f"/>
    </linearGradient>

    <!-- Glowing Rim Light -->
    <linearGradient id="fn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Steam / Thermal Wave Gradient -->
    <linearGradient id="fn-steam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Organic Mint Leaf Gradient -->
    <linearGradient id="fn-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Brilliant Gold Sparkle Gradient -->
    <linearGradient id="fn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="fn-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#032025" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Inner Soft Glow -->
    <radialGradient id="fn-glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0e9291" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0e9291" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Rounded Nest Container -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#fn-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#fn-glow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" stroke="url(#fn-rim)" stroke-width="1.5"/>

  <!-- Logo Graphics Group -->
  <g filter="url(#fn-shadow)">
    <!-- Architectural Roofline with Curved Modern Crest -->
    <path d="M13 34.5L32 17.5L51 34.5" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Home Foundation / Clean Frame -->
    <path d="M19 33.5V47.5C19 49.4 20.6 51 22.5 51H41.5C43.4 51 45 49.4 45 47.5V33.5" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Steam Dynamics: Thermal Ribbon 1 -->
    <path d="M26 45C26 38.5 31.5 36.5 31.5 31C31.5 26.5 28.5 24.5 30.5 21" stroke="url(#fn-steam)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Steam Dynamics: Thermal Ribbon 2 -->
    <path d="M35.5 45C35.5 39.5 40 37.5 40 33C40 29.5 38 27.5 39 24.5" stroke="url(#fn-steam)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Freshness Heart / Organic Eco Leaf -->
    <path d="M32 46.5C26.5 46.5 24.5 40.5 27.5 35.5C30.5 30.5 36.5 28.5 36.5 28.5C36.5 28.5 37.5 35.5 35.5 40.5C34.5 43.5 33.5 46.5 32 46.5Z" fill="url(#fn-leaf)" opacity="0.95"/>

    <!-- Star Burst / Clean Shine (Diamond 4-Point Star) -->
    <g transform="translate(44, 15)">
      <!-- Outer Glow -->
      <circle cx="0" cy="0" r="5" fill="#fef08a" opacity="0.3"/>
      <!-- 4-point Diamond Core -->
      <path d="M0 -7 C0.6 -1.8 1.8 -0.6 7 0 C1.8 0.6 0.6 1.8 0 7 C-0.6 1.8 -1.8 0.6 -7 0 C-1.8 -0.6 -0.6 -1.8 0 -7 Z" fill="url(#fn-gold)"/>
      <circle cx="0" cy="0" r="1.4" fill="#ffffff"/>
    </g>

    <!-- Secondary Micro Sparkle -->
    <g transform="translate(15.5, 20.5) scale(0.65)">
      <path d="M0 -6 C0.5 -1.5 1.5 -0.5 6 0 C1.5 0.5 0.5 1.5 0 6 C-0.5 1.5 -1.5 0.5 -6 0 C-1.5 -0.5 -0.5 -1.5 0 -6 Z" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>
</svg>